name: Daily Mystery Short

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 09:00 IST every day
  workflow_dispatch:

permissions:
  contents: write           # lets the workflow save story progress (series.json) to the repo

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Write today's part
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python make_short.py

      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY: private   # change to public once you trust the output
        run: python upload_youtube.py

      # Only runs if the upload worked, so a failed day never skips a story part.
      - name: Save story progress
        run: |
          cp output/series_next.json series.json
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add series.json
          git commit -m "Story progress [skip ci]" || echo "nothing to commit"
          git push
